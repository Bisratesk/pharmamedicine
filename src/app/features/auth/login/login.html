<form [formGroup]="form" (ngSubmit)="submit()">
  <h2>Login</h2>

  <input type="email" placeholder="Email" formControlName="email" />
  @if (form.controls.email.dirty && form.controls.email.invalid) {
    <small>Enter a valid email</small>
  }

  <input type="password" placeholder="Password" formControlName="password" />
  @if (form.controls.password.dirty && form.controls.password.invalid) {
    <small>Password must be at least 4 characters</small>
  }

  @if (error()) {
    <small>{{ error() }}</small>
  }

  <button type="submit" [disabled]="form.invalid || loading()">
    {{ loading() ? 'Signing in...' : 'Login' }}
  </button>
  <p>No account? <a routerLink="/register">Register</a></p>
</form>
